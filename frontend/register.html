<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a new FoodApp account to order meals from top restaurants." />
    <title>Create Account — FoodApp</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/chatbot.css" />
    <link rel="stylesheet" href="css/auth.css" />

    <!-- Theme Init (Prevent FOUC) -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('foodapp_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Dynamic Header / Navbar -->
    <div id="navbarPlaceholder"></div>

    <!-- Main Authentication View -->
    <main class="auth-page-wrapper">
      <div class="auth-card" style="max-width: 520px;">
        <!-- Auth Header -->
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <div class="logo-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
            </div>
            <span>FoodApp</span>
          </a>
          <h1>Create an Account</h1>
          <p>Join FoodApp today and enjoy 50% OFF on your first 3 orders!</p>
        </div>

        <!-- Role Selector (Customer vs Partner/Admin) -->
        <div class="role-tabs-container">
          <button type="button" class="role-tab-btn active" onclick="Auth.setRole('CUSTOMER', this)">
            <span>🍔</span> Customer
          </button>
          <button type="button" class="role-tab-btn" onclick="Auth.setRole('ADMIN', this)">
            <span>🏪</span> Restaurant Partner
          </button>
        </div>

        <!-- Register Form -->
        <form class="auth-form" onsubmit="Auth.handleRegister(event)">
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="regName">
              <span>Full Name</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="regName" class="form-input" placeholder="e.g. Rahul Sharma">
            </div>
            <span class="field-error-message" id="regNameError"></span>
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="regEmail">
              <span>Email Address</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input type="email" id="regEmail" class="form-input" placeholder="name@example.com">
            </div>
            <span class="field-error-message" id="regEmailError"></span>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label class="form-label" for="regPhone">
              <span>Mobile Phone</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
              </span>
              <input type="tel" id="regPhone" class="form-input" placeholder="+91 98765 43210">
            </div>
            <span class="field-error-message" id="regPhoneError"></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="regPassword">
              <span>Create Password</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="regPassword" class="form-input" placeholder="At least 6 characters">
              <button type="button" class="input-icon-toggle" onclick="Auth.togglePasswordVisibility('regPassword', this)" aria-label="Toggle password visibility">
                👁️
              </button>
            </div>
            <span class="field-error-message" id="regPasswordError"></span>
          </div>

          <!-- Default Address -->
          <div class="form-group">
            <label class="form-label" for="regAddress">
              <span>Primary Delivery Address</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              </span>
              <input type="text" id="regAddress" class="form-input" placeholder="Building, Street, Area, City, Pin">
            </div>
            <span class="field-error-message" id="regAddressError"></span>
          </div>

          <!-- Terms Checkbox -->
          <div class="form-options-row">
            <label class="checkbox-label">
              <input type="checkbox" required checked>
              <span>I agree to the <a href="#" style="color: var(--color-primary); text-decoration: underline;">Terms & Conditions</a> and Privacy Policy.</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-auth-submit" id="regSubmitBtn">
            Create Account
          </button>
        </form>

        <!-- Switch to Login -->
        <div class="auth-switch-text">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footerPlaceholder"></div>

    <!-- JavaScript Scripts -->
    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
