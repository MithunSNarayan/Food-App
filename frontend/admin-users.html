<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manage FoodApp registered users, customer accounts, and restaurant partner staff permissions." />
    <title>User Directory & Access Control — FoodApp Admin</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/admin.css" />

    <!-- Theme Init (Prevent FOUC) -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('foodapp_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="admin-body">
    <div class="admin-layout-wrapper">
      <!-- Admin Sidebar -->
      <aside class="admin-sidebar" id="adminSidebar"></aside>

      <!-- Main Admin View Area -->
      <div class="admin-main">
        <!-- Admin Topbar -->
        <header class="admin-topbar" id="adminTopbar"></header>

        <!-- Admin Content Area -->
        <main class="admin-content-area">
          <!-- Page Header -->
          <div class="flex items-center justify-between" style="margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
            <div>
              <h1 style="font-size: 24px; font-weight: 800; color: #0F172A; margin-bottom: 4px;">User Directory & Access Control</h1>
              <p style="font-size: 13.5px; color: #64748B;" id="userCountText">Manage registered customer accounts and partner administrative access</p>
            </div>
            <button type="button" class="btn btn-primary" onclick="AdminUsers.openAddModal()" style="box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);">
              <span>+</span> Add New User
            </button>
          </div>

          <!-- 1. KPI METRICS SUMMARY ROW -->
          <div class="kpi-grid" id="userMetricsKPIs" style="grid-template-columns: repeat(3, 1fr);"></div>

          <!-- 2. SEARCH & FILTERS TOOLBAR -->
          <div class="admin-card" style="padding: 16px 20px; margin-bottom: 20px;">
            <div class="flex items-center justify-between" style="flex-wrap: wrap; gap: 16px;">
              <div style="flex: 1; max-width: 420px; position: relative;">
                <input type="text" id="userSearchInput" class="saas-input" placeholder="Search user by name, email, phone, or address..." style="padding-left: 38px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" style="position: absolute; left: 12px; top: 13px; pointer-events: none;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </div>

              <div class="flex items-center gap-3">
                <label style="font-size: 12.5px; font-weight: 700; color: #64748B; text-transform: uppercase;">Role:</label>
                <select id="userRoleFilter" class="saas-input" style="width: 170px; height: 42px; cursor: pointer;">
                  <option value="ALL">All Roles</option>
                  <option value="CUSTOMER">Customers Only</option>
                  <option value="ADMIN">Admins / Partners</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 3. USERS TABLE CARD -->
          <div class="admin-card" style="padding: 0; overflow: hidden;">
            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Contact Info</th>
                    <th>System Role</th>
                    <th>Delivery Address</th>
                    <th>Joined</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Add / Edit User Modal -->
    <div class="modal-overlay" id="userModal" onclick="AdminUsers.closeModal()">
      <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close-btn" onclick="AdminUsers.closeModal()" aria-label="Close modal">✕</button>

        <div class="modal-header-box">
          <h3 id="userModalTitle">Add New System User</h3>
          <p>Create or update user account permissions and contact information</p>
        </div>

        <form id="userForm" onsubmit="AdminUsers.saveUser(event)">
          <input type="hidden" id="formUserId">

          <div class="modal-form-grid">
            <!-- Full Name -->
            <div class="full-col">
              <label class="saas-label" for="formUserName">Full Name *</label>
              <input type="text" id="formUserName" class="saas-input" placeholder="e.g. Rahul Sharma" required>
            </div>

            <!-- Email Address -->
            <div>
              <label class="saas-label" for="formUserEmail">Email Address *</label>
              <input type="email" id="formUserEmail" class="saas-input" placeholder="user@example.com" required>
            </div>

            <!-- Phone Number -->
            <div>
              <label class="saas-label" for="formUserPhone">Mobile Phone *</label>
              <input type="tel" id="formUserPhone" class="saas-input" placeholder="+91 98765 43210" required>
            </div>

            <!-- System Role -->
            <div>
              <label class="saas-label" for="formUserRole">Account Role *</label>
              <select id="formUserRole" class="saas-input" required>
                <option value="CUSTOMER">CUSTOMER (Standard App User)</option>
                <option value="ADMIN">ADMIN (Store Partner / Kitchen Staff)</option>
              </select>
            </div>

            <!-- Password -->
            <div>
              <label class="saas-label" for="formUserPassword">Password</label>
              <input type="password" id="formUserPassword" class="saas-input" placeholder="••••••••">
            </div>

            <!-- Delivery Address -->
            <div class="full-col">
              <label class="saas-label" for="formUserAddress">Primary Address</label>
              <input type="text" id="formUserAddress" class="saas-input" placeholder="e.g. BTM Layout 2nd Stage, Bengaluru">
            </div>
          </div>

          <!-- Footer Actions -->
          <div class="modal-footer-actions">
            <button type="button" class="btn btn-outline" onclick="AdminUsers.closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" style="box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);">
              Save User
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- JavaScript Scripts -->
    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-users.js"></script>
  </body>
</html>
