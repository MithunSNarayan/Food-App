<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to your FoodApp account to order meals and track live delivery." />
    <title>Login — FoodApp</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/chatbot.css" />
    <link rel="stylesheet" href="css/auth.css" />

    <!-- Theme Init (Prevent FOUC) -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('foodapp_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Dynamic Header / Navbar -->
    <div id="navbarPlaceholder"></div>

    <!-- Main Authentication View -->
    <main class="auth-page-wrapper">
      <div class="auth-card">
        <!-- Auth Header -->
        <div class="auth-header">
          <a href="index.html" class="auth-logo">
            <div class="logo-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
            </div>
            <span>FoodApp</span>
          </a>
          <h1>Welcome back</h1>
          <p>Sign in to order food, track deliveries, and manage orders</p>
        </div>

        <!-- Role Selector (Customer vs Partner/Admin) -->
        <div class="role-tabs-container">
          <button type="button" class="role-tab-btn active" onclick="Auth.setRole('CUSTOMER', this)">
            <span>🍔</span> Customer
          </button>
          <button type="button" class="role-tab-btn" onclick="Auth.setRole('ADMIN', this)">
            <span>🏪</span> Restaurant Partner
          </button>
        </div>

        <!-- Quick Demo Account Helper -->
        <div class="demo-credentials-box">
          <span>💡</span>
          <div>
            <strong>Quick Demo:</strong> Click <a href="#" onclick="event.preventDefault(); Auth.fillDemoCredentials()" style="color: #1D4ED8; font-weight: 700; text-decoration: underline;">Auto-fill Demo</a> (<code id="demoEmail">mithun@foodapp.com</code>)
          </div>
        </div>

        <!-- Login Form -->
        <form class="auth-form" onsubmit="Auth.handleLogin(event)">
          <!-- Email Input -->
          <div class="form-group">
            <label class="form-label" for="loginEmail">
              <span>Email Address</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input type="email" id="loginEmail" class="form-input" placeholder="name@example.com" autocomplete="email">
            </div>
            <span class="field-error-message" id="loginEmailError"></span>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label class="form-label" for="loginPassword">
              <span>Password</span>
              <span class="required-star">*</span>
            </label>
            <div class="input-with-icon">
              <span class="input-icon-left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="input-icon-toggle" onclick="Auth.togglePasswordVisibility('loginPassword', this)" aria-label="Toggle password visibility">
                👁️
              </button>
            </div>
            <span class="field-error-message" id="loginPasswordError"></span>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-options-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMeCheckbox" checked>
              <span>Remember me</span>
            </label>
            <a href="#" onclick="event.preventDefault(); UIComponents.showToast('Password reset link sent to your registered email.', 'normal')" class="forgot-password-link">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary btn-auth-submit" id="loginSubmitBtn">
            Sign In
          </button>
        </form>

        <!-- Switch to Register -->
        <div class="auth-switch-text">
          Don't have an account? <a href="register.html">Create an account</a>
        </div>
      </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footerPlaceholder"></div>

    <!-- JavaScript Scripts -->
    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
