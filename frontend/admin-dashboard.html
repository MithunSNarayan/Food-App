<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FoodApp Admin & Restaurant Partner Dashboard for live sales, analytics, and operational management." />
    <title>Admin Dashboard — FoodApp Partner</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/admin.css" />

    <!-- Theme Init (Prevent FOUC) -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('foodapp_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="admin-body">
    <div class="admin-layout-wrapper">
      <!-- Admin Sidebar -->
      <aside class="admin-sidebar" id="adminSidebar"></aside>

      <!-- Main Admin View Area -->
      <div class="admin-main">
        <!-- Admin Topbar -->
        <header class="admin-topbar" id="adminTopbar"></header>

        <!-- Admin Content Area -->
        <main class="admin-content-area">
          <!-- Page Header -->
          <div style="margin-bottom: 24px;">
            <h1 style="font-size: 24px; font-weight: 800;">Dashboard Overview</h1>
            <p style="font-size: 13.5px; color: var(--color-text-secondary);">Real-time performance metrics and active store status</p>
          </div>

          <!-- 1. KPI CARDS GRID -->
          <div class="kpi-grid" id="dashboardKPIs"></div>

          <!-- 2. QUICK SHORTCUTS & RECENT ORDERS TABLE -->
          <div class="admin-card">
            <div class="admin-card-header">
              <div>
                <h3>Incoming & Active Orders</h3>
                <p style="font-size: 12.5px; color: var(--color-text-muted); margin-top: 2px;">Orders currently being prepared or dispatched</p>
              </div>
              <div class="flex gap-2">
                <a href="admin-menu.html" class="btn btn-outline btn-sm">+ Add New Dish</a>
                <a href="admin-orders.html" class="btn btn-primary btn-sm">Open Kitchen Board ➔</a>
              </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>Order #</th>
                    <th>Customer</th>
                    <th>Ordered Dishes</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="recentOrdersTableBody"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- JavaScript Scripts -->
    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script src="js/admin.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        AdminApp.init('dashboard');
      });
    </script>
  </body>
</html>
