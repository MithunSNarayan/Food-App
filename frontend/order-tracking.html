<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Track your food order in real-time from kitchen preparation to doorstep delivery." />
    <title>Live Order Tracking — FoodApp</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/chatbot.css" />
    <link rel="stylesheet" href="css/tracking.css" />

    <!-- Theme Init (Prevent FOUC) -->
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('foodapp_theme');
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'dark' || (saved !== 'light' && prefersDark) ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Dynamic Header / Navbar -->
    <div id="navbarPlaceholder"></div>

    <!-- Main Page Content -->
    <main>
      <div class="container">
        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb-nav" aria-label="Breadcrumb" style="padding: 16px 0 8px 0;">
          <ul class="breadcrumb-list" style="display: flex; gap: 8px; list-style: none; font-size: 13px; color: var(--color-text-muted);">
            <li><a href="index.html">Home</a></li>
            <li>/</li>
            <li><a href="orders.html">Orders</a></li>
            <li>/</li>
            <li style="color: var(--color-text-primary); font-weight: 600;">Live Tracking</li>
          </ul>
        </nav>

        <!-- Tracking Main Container -->
        <section class="tracking-main-section" id="trackingMainContainer"></section>
      </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footerPlaceholder"></div>

    <!-- JavaScript Scripts -->
    <script src="js/mockData.js"></script>
    <script src="js/components.js"></script>
    <script src="js/chatbot.js"></script>
    <script src="js/tracking.js"></script>
  </body>
</html>
